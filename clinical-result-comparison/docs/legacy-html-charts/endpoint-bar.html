<!-- HTML fragment（Tool Smith 可视化交付格式）：仅内容 + <style> + <script>，无文档级包裹标签 -->
<!-- 设计语言：lieflat-charts violet 紫罗兰预设 · 单色相明度阶 · 横档柱（1 格 = 1 单位）· 一律实心无阴影 -->
<style>
/* ===== 颜色全部引用宿主注入 --viz-*（fallback = lieflat violet 预设） ===== */
:root{
  --brand-bg:#F7F2EB; --brand-surface:#F7F2EB; --brand-text:#2B1450;
  --brand-muted:rgba(43,20,80,.60); --brand-faint:rgba(43,20,80,.32); --brand-border:rgba(43,20,80,.16);
  --brand-s1:#55339A; --brand-s2:#2B1450; --brand-s3:#8A63D2; --brand-s4:#C6B3EE; --brand-s5:#E4DAF8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--viz-background,var(--brand-bg))}
body{font-family:var(--font-sans,"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif);color:var(--viz-text,var(--brand-text));-webkit-font-smoothing:antialiased;padding:24px 20px}
.chart{background:var(--viz-surface,var(--viz-background,var(--brand-surface)));border-radius:24px;padding:26px 28px 18px;max-width:920px;margin:0 auto}
.badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.1em;padding:3px 11px;border-radius:99px;margin-bottom:14px;border:1px dashed var(--viz-text-muted,var(--brand-faint));color:var(--viz-text-muted,var(--brand-muted))}
h1{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.sub{font-size:12px;color:var(--viz-text-muted,var(--brand-muted));margin-top:5px;line-height:1.65}
.sub .sw{display:inline-block;width:12px;height:12px;border-radius:99px;margin:0 2px -2px 0;box-shadow:inset 0 0 0 1px rgba(43,20,80,.18)}
.stage{position:relative;width:100%;margin:16px 0 2px}
.stage svg{display:block;width:100%;height:auto}
svg text{font-family:inherit}
.src{margin-top:14px;padding-top:11px;border-top:1px dashed var(--viz-text-muted,var(--brand-faint));font-size:9.5px;letter-spacing:.08em;font-weight:500;color:var(--viz-text-muted,var(--brand-faint));display:flex;flex-wrap:wrap;gap:3px 14px;line-height:1.65}
.src b{font-weight:600;color:var(--viz-text-muted,var(--brand-muted))}
.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.tip{position:fixed;pointer-events:none;background:#2B1450;color:#F7F2EB;font-size:12px;padding:10px 13px;border-radius:12px;max-width:320px;line-height:1.55;opacity:0;transition:opacity .12s;z-index:99;box-shadow:0 10px 26px -10px rgba(43,20,80,.5)}
@supports (color: color-mix(in srgb, red, transparent)){
  .tip{background:color-mix(in srgb, var(--viz-text,var(--brand-text)) 94%, transparent)}
}
.tip.on{opacity:1}
.tip .tt{font-weight:700;margin-bottom:2px;color:#C6B3EE}
</style>

<div class="chart">
  <span class="badge" id="badge">RUNG BARS · ORDINAL</span>
  <h1 id="title">终点对比 · 柱状图</h1>
  <div class="sub" id="subtitle"></div>
  <div class="stage" id="stage"></div>
  <div class="legend" id="legend"></div>
  <div class="src">
    <span id="facts"></span>
    <span id="note"></span>
    <span id="source"></span>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
/* ===================== 数据区（Agent 填写；仅来自临床证据原文） =====================
   适用：混合/不同试验、且终点没有时间维度（如 ORR、缓解率等单值终点）。
   **按临床问题分组时**：每个组生成一份独立实例（各图独立 CHART 文件，如
   group1-orr.html / group2-orr.html）；图内并列该组各试验的试验组结果值，
   研究内对照数值与证据边界放 note（含 {{ref_n}}）；标题/副标题注明
   “跨试验并列展示≠头对头比较”；不满足可比条件的组不出图。
   bars[]：
     label  显示名（试验+试验组方案）；value 终点数值；ci 置信区间文本（可空）；
     series 可选：显式指定紫阶档位（0..5，对应 SER 紫系色），缺省 0；
             不填时按「明度=数值」自动取色——柱越深 = 数值越高；
     note 悬停补充说明。
   排序：柱形按 value 从高到低自动降序（模板内完成，无需人工排）；
   折线/时间轴保持时间顺序（数组顺序即时间顺序，模板不重排）。
   色彩逻辑：violet 单色相紫阶，深浅 = 数值高低；不混入第二套色系。
*/
const CHART = {
  title: "客观缓解率（ORR）对比",
  subtitle: "不同试验 / 治疗组主要终点 · 无时间维度终点用柱状图",
  unit: "%",
  note: "柱长按终点数值；深浅 = 数值高低；数值与区间均来自 source_full_text",
  source: "数据来源：各研究公开披露材料（source_full_text 提取）",
  bars: [
    { label:"试验A · 研究组", value:63.5, ci:"95%CI [55.2, 71.0]", note:"HARMONi-6 研究组" },
    { label:"试验A · 对照组", value:31.2, ci:"95%CI [23.4, 39.8]", note:"HARMONi-6 对照组" },
    { label:"试验B · 研究组", value:58.0, ci:"95%CI [50.1, 65.6]", note:"试验 B 研究组" },
    { label:"试验B · 对照组", value:27.9, ci:"95%CI [20.6, 36.0]", note:"试验 B 对照组" }
  ]
};

/* ===================== 渲染区（模板逻辑，勿改） ===================== */
(function(){
  // 读取宿主注入的 --viz-* token（未注入时用 violet fallback）
  function viz(name, fb){ var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fb; }
  // 紫系 12 档明度阶（深 → 浅；数值越高取越深档）
  var SHADES = ["#2B1450","#341B60","#3D2170","#462880","#4F2F8F","#59369E","#6441AA","#704BB6","#7B55C2","#8A63D2","#A78EE0","#C6B3EE"];
  // 系列紫系色（显式 series 档位时用；0..5）
  var SER = [viz("--viz-series-1","#55339A"), viz("--viz-series-2","#2B1450"), viz("--viz-series-3","#8A63D2"), viz("--viz-series-4","#C6B3EE"), viz("--viz-series-5","#E4DAF8"), "rgba(85,51,154,.4)"];
  var INK = viz("--viz-text","#2B1450");
  var PAPER = viz("--viz-background","#F7F2EB");
  var MUTED = viz("--viz-text-muted","rgba(43,20,80,.60)");
  var FAINT = viz("--viz-text-muted","rgba(43,20,80,.32)");
  var GRID = viz("--viz-border","rgba(43,20,80,.16)");

  var bars = (CHART.bars || []).slice().sort(function(a,b){ return (b.value||0) - (a.value||0); }), n = bars.length;
  var W = 900;
  var rowH = Math.max(36, Math.min(66, 940 / n));
  var H = 84 + n * rowH + 44;
  var maxV = 1;
  bars.forEach(function(b){ if (b.value > maxV) maxV = b.value; });
  maxV *= 1.06; // 顶端余量
  // 左侧标签宽 = 最长标签估算
  var padL = 20;
  bars.forEach(function(b){ padL = Math.max(padL, Math.ceil(String(b.label).length) * 12 + 14); });
  padL = Math.min(padL, 250);
  var padR = 172, padT = 46, padB = 40;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  function esc(s){ return String(s == null ? "" : s).replace(/[<>&]/g, function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]; }); }
  // 横档步进：每 1 单位 = 1 条竖档，档距 ~2.6px；超宽时按 1-2-5 放大步进
  var steps = [0.5,1,2,5,10,20,50,100,200,500,1000,2000,5000,10000];
  var rungStep = 1, si = 1;
  while (si < steps.length - 1 && (maxV / steps[si]) * 2.6 > plotW * 0.96){ rungStep = steps[++si]; }
  var pxPerRung = Math.min(2.6, (plotW * 0.96) / (maxV / rungStep));
  function barPx(v){ return (v / maxV) * plotW * 0.96; }
  // 确定性随机（lieflat 规则：禁用 Math.random，刷新必须长一样）
  function rnd(i, k){ return Math.abs(((i * 73856093) ^ (k * 19349663)) % 1000) / 1000; }

  document.getElementById("badge").textContent = "RUNG BARS · " + CHART.unit.toUpperCase() + " · ORDINAL";
  document.getElementById("title").textContent = CHART.title;
  document.getElementById("subtitle").textContent = CHART.subtitle || "";
  document.getElementById("note").innerHTML = CHART.note ? "<b>说明：</b>" + esc(CHART.note) : "";
  document.getElementById("source").textContent = CHART.source || "";
  // 图例：深浅 = 数值
  var legend = document.getElementById("legend");
  var leg = document.createElement("div"); leg.className = "sub"; leg.style.marginTop = "2px";
  leg.innerHTML =
    '<span class="sw" style="background:#2B1450"></span>' +
    '<span class="sw" style="background:#4F2F8F"></span>' +
    '<span class="sw" style="background:#704BB6"></span>' +
    '<span class="sw" style="background:#A78EE0"></span>' +
    '<span class="sw" style="background:#C6B3EE"></span>' +
    '&nbsp; 柱深浅 = 数值高低（violet 紫罗兰 · 单色相明度阶）· 悬停看区间与补充说明';
  legend.appendChild(leg);
  document.getElementById("facts").innerHTML = '<b>横档 1 格 = ' + rungStep + ' ' + esc(CHART.unit||"") + '</b> · ' + n + ' 个治疗组 · 按数值降序 · ' + esc((CHART.subtitle||"").split("·")[0] || "") + ' · 跨试验并列展示 ≠ 头对头比较';

  var NS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("role", "img");

  // 网格竖线（nice 刻度）+ 底轴
  var g = document.createElementNS(NS, "g");
  var tickStep = 1, p = Math.pow(10, Math.floor(Math.log(maxV) / Math.LN10)), f = maxV / p;
  var m = f < 1.5 ? 1 : (f < 3.5 ? 2 : (f < 7 ? 5 : 10));
  tickStep = m * p / 2; // 约 6 条线
  for (var tv = tickStep; tv < maxV; tv += tickStep){
    var x = padL + (tv / maxV) * plotW * 0.96;
    g.innerHTML += '<line x1="' + x + '" y1="' + padT + '" x2="' + x + '" y2="' + (padT + plotH) + '" stroke="' + GRID + '" stroke-width=".8"/>' +
      '<text x="' + x + '" y="' + (padT + plotH + 18) + '" text-anchor="middle" font-size="9.5" fill="' + FAINT + '" font-weight="600">' + tv + '</text>';
  }
  g.innerHTML += '<line x1="' + padL + '" y1="' + (padT + plotH + 4) + '" x2="' + (padL + plotW * 0.96 + 4) + '" y2="' + (padT + plotH + 4) + '" stroke="' + GRID + '" stroke-width="1"/>';
  svg.appendChild(g);

  var barH = Math.max(20, Math.min(34, rowH * 0.6));
  var showCi = rowH >= 46;
  var labelFs = rowH < 44 ? 11 : 12;

  bars.forEach(function(b, i){
    var y = padT + i * rowH + (rowH - barH) / 2;
    var bw = barPx(b.value);
    var nRungs = Math.max(1, Math.round(b.value / rungStep));
    // 档色：明度 = 数值（未显式 series 时）；显式 series 则用紫系 SER 档位
    var color;
    if (b.series != null) color = SER[b.series % SER.length];
    else color = SHADES[Math.round((1 - b.value / (maxV * 0.94)) * (SHADES.length - 1))] || SHADES[SHADES.length - 1];
    var node = document.createElementNS(NS, "g");
    node.style.cursor = "pointer";
    // 轨道（TRACK 打底，保证弱值可读）
    node.innerHTML += '<rect x="' + padL + '" y="' + y + '" width="' + (plotW * 0.96) + '" height="' + barH + '" rx="' + (barH/2) + '" fill="' + GRID + '" opacity=".22"/>';
    // 横档：每 1 单位一条竖档
    var rungs = "";
    for (var k = 0; k < nRungs; k++){
      var rx = padL + k * pxPerRung;
      if (rx > padL + bw) break;
      rungs += '<line x1="' + rx + '" y1="' + (y + 1.5) + '" x2="' + rx + '" y2="' + (y + barH - 1.5) + '" stroke="' + color + '" stroke-width="1" opacity="' + (0.5 + rnd(i + 1, k + 2) * 0.5) + '" class="fade" style="animation-delay:' + (i * 0.05 + k * 0.0035) + 's"/>';
    }
    node.innerHTML += rungs;
    // 标签 + 数值 + CI
    node.innerHTML +=
      '<text x="' + (padL - 14) + '" y="' + (y + barH/2 + 4) + '" text-anchor="end" font-size="' + labelFs + '" fill="' + INK + '" font-weight="600" class="fade" style="animation-delay:' + (i * 0.05) + 's">' + esc(b.label) + '</text>' +
      '<text x="' + (padL + bw + 9) + '" y="' + (y + barH/2 + 5) + '" font-size="13.5" font-weight="800" fill="' + INK + '" class="fade" style="animation-delay:' + (i * 0.05 + 0.12) + 's;' + 'paint-order:stroke;stroke:' + PAPER + ';stroke-width:4px">' + esc(b.value) + esc(CHART.unit||"") + '</text>' +
      (b.ci && showCi ? '<text x="' + (padL + bw + 9) + '" y="' + (y + barH/2 + 20) + '" font-size="10" fill="' + FAINT + '" class="fade" style="animation-delay:' + (i * 0.05 + 0.18) + 's;' + 'paint-order:stroke;stroke:' + PAPER + ';stroke-width:3px">' + esc(b.ci) + '</text>' : "");
    node.addEventListener("mouseenter", function(){ showTip(b); });
    node.addEventListener("mousemove", moveTip);
    node.addEventListener("mouseleave", hideTip);
    svg.appendChild(node);
  });

  document.getElementById("stage").appendChild(svg);

  function showTip(b){
    var t = document.getElementById("tip");
    t.innerHTML = '<div class="tt">' + esc(b.label) + '</div>' +
      '<div style="font-weight:800">' + esc(b.value) + esc(CHART.unit||"") + '</div>' +
      (b.ci ? '<div style="opacity:.85">' + esc(b.ci) + '</div>' : "") +
      (b.note ? '<div style="opacity:.85">' + esc(b.note) + '</div>' : "");
    t.classList.add("on");
  }
  function moveTip(evt){
    var t = document.getElementById("tip"), r = t.getBoundingClientRect();
    var x = evt.clientX + 14, y = evt.clientY - 10;
    if (x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - 14;
    t.style.left = x + "px"; t.style.top = y + "px";
  }
  function hideTip(){ document.getElementById("tip").classList.remove("on"); }
})();
</script>
