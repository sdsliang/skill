<!-- HTML fragment（Tool Smith 可视化交付格式）：仅内容 + <style> + <script>，无文档级包裹标签 -->
<style>
/* ===== Tool Smith 品牌 token（主色一律 var(--viz-*)；品牌 hex 仅作 fallback） ===== */
:root{
  --brand-bg:#f4f5f7; --brand-surface:#ffffff; --brand-text:#020A1A;
  --brand-muted:#4e5969; --brand-faint:#8993a4; --brand-border:#DADEE6;
  --brand-s1:#3d7eff; --brand-s2:#7c3aed; --brand-s3:#0ea5e9; --brand-s4:#14b8a6; --brand-s5:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--viz-background,var(--brand-bg))}
body{font-family:var(--font-sans,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif);color:var(--viz-text,var(--brand-text));-webkit-font-smoothing:antialiased;padding:18px}
.chart{background:var(--viz-surface,var(--brand-surface));border:1px solid var(--viz-border,var(--brand-border));border-radius:var(--border-radius-xl,18px);box-shadow:0 1px 2px rgba(2,10,26,.06),0 16px 40px -20px rgba(2,10,26,.18);padding:22px 26px 16px;max-width:940px;margin:0 auto}
.header{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.accent{flex:none;width:5px;height:36px;border-radius:4px;background:linear-gradient(135deg,var(--viz-series-1,var(--brand-s1)),var(--viz-series-3,var(--brand-s3)));margin-top:2px}
h1{font-size:18px;font-weight:700;letter-spacing:.2px;line-height:1.4}
.sub{font-size:12.5px;color:var(--viz-text-muted,var(--brand-muted));margin-top:3px}
.stage{position:relative;width:100%;margin:8px 0 2px}
.stage svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:6px 0 4px;font-size:12px;color:var(--viz-text-muted,var(--brand-muted))}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:18px;height:3px;border-radius:2px;flex:none;margin-top:1px}
footer{margin-top:4px;padding-top:9px;border-top:1px dashed var(--viz-border,var(--brand-border));font-size:11.5px;color:var(--viz-text-muted,var(--brand-faint));display:flex;flex-wrap:wrap;gap:3px 16px;line-height:1.5}
footer b{color:var(--viz-text-muted,var(--brand-muted));font-weight:600}
.tip{position:fixed;pointer-events:none;background:rgba(2,10,26,.94);color:var(--viz-background,#f4f5f7);font-size:12px;padding:9px 12px;border-radius:10px;max-width:300px;line-height:1.55;opacity:0;transition:opacity .12s;z-index:99;box-shadow:0 10px 26px -10px rgba(2,10,26,.45)}
@supports (color: color-mix(in srgb, red, transparent)){
  .tip{background:color-mix(in srgb, var(--viz-text,var(--brand-text)) 94%, transparent)}
}
.tip.on{opacity:1}
.tip .tt{font-weight:700;margin-bottom:2px;color:var(--viz-info,#7da6ff)}
</style>

<div class="chart">
  <div class="header">
    <span class="accent"></span>
    <div>
      <h1 id="title">终点趋势 · 折线图</h1>
      <div class="sub" id="subtitle"></div>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="legend" id="legend"></div>
  <footer>
    <span id="note"></span>
    <span id="source"></span>
  </footer>
</div>
<div class="tip" id="tip"></div>

<script>
/* ===================== 数据区（Agent 填写；仅来自临床证据原文） =====================
   适用：混合/不同试验、终点有时间维度（如体重较基线变化、PFS/OS 等按时间点取值）。
   series[]：
     name   系列名（试验+治疗组）；color 系列色（缺省自动取 --viz-series-1..5，
            也可填 token 名如 "--viz-series-1" 或 hex）；
     points 时间点数组 [{t:时间标签, v:数值}]。若全部系列都只有 1 个点，
     自动进入「单点模式」：只画点 + 数值标签，不强行连线。
   unit：数值单位；xLabel：时间轴标题（可空）。
*/
const CHART = {
  title: "体重较基线的变化",
  subtitle: "时间维主要终点 · 不同治疗组随时间的趋势",
  unit: "kg",
  xLabel: "治疗周数",
  note: "折线仅连接已披露的时间点，不作外推；单点终点以点展示",
  source: "数据来源：各研究公开披露材料（source_full_text 提取）",
  series: [
    { name:"试验A · 研究组", points:[ {t:"W4",v:-1.2}, {t:"W12",v:-2.8}, {t:"W24",v:-3.1} ] },
    { name:"试验A · 对照组", points:[ {t:"W4",v:-0.4}, {t:"W12",v:-0.9}, {t:"W24",v:-1.2} ] }
  ]
};

/* ===================== 渲染区（模板逻辑，勿改） ===================== */
(function(){
  // 读取宿主注入的 --viz-* token（未注入时用品牌 hex fallback）
  function viz(name, fb){ var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fb; }
  // 颜色：支持 token 名（"--viz-xxx"）或 hex
  function pick(c, fb){ return (c && c.indexOf("--viz") === 0) ? viz(c, fb) : (c || fb); }
  // 系列色表：--viz-series-1..5
  var S = [viz("--viz-series-1","#3d7eff"), viz("--viz-series-2","#7c3aed"), viz("--viz-series-3","#0ea5e9"), viz("--viz-series-4","#14b8a6"), viz("--viz-series-5","#f59e0b")];
  var series = CHART.series || [], nS = series.length;
  var allPts = []; series.forEach(function(s){ allPts = allPts.concat(s.points || []); });
  var singleMode = allPts.length > 0 && series.every(function(s){ return (s.points||[]).length === 1; });

  var W = 900, H = 360, padL = 60, padR = 40, padT = 30, padB = 52;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  // X 轴：以第一个系列的时间点为准（时间点顺序即轴序）
  var timeLabels = (series[0] && series[0].points ? series[0].points : []).map(function(p){ return p.t; });
  var m = timeLabels.length;
  var allV = allPts.map(function(p){ return p.v; });
  var minV = Math.min.apply(null, allV), maxV = Math.max.apply(null, allV);
  var span = (maxV - minV) || 1; minV -= span * 0.18; maxV += span * 0.18;
  function X(i){ return m === 1 ? padL + plotW/2 : padL + plotW * i / (m - 1); }
  function Y(v){ return padT + plotH * (maxV - v) / (maxV - minV); }
  function esc(s){ return String(s == null ? "" : s).replace(/[<>&]/g, function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]; }); }

  document.getElementById("title").textContent = CHART.title;
  document.getElementById("subtitle").textContent = (CHART.subtitle||"") + (singleMode ? " · 单点模式" : "");
  document.getElementById("note").innerHTML = CHART.note ? "<b>说明：</b>" + esc(CHART.note) : "";
  document.getElementById("source").textContent = CHART.source || "";

  var NS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("role", "img");

  var border = viz("--viz-border", "#DADEE6");
  var faint = viz("--viz-text-muted", "#8993a4");
  var muted = viz("--viz-text-muted", "#4e5969");

  // 网格 + Y 刻度
  var g = document.createElementNS(NS, "g");
  for (var k = 0; k <= 4; k++){
    var v = minV + (maxV - minV) * k / 4, y = Y(v);
    g.innerHTML += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W-padR) + '" y2="' + y + '" stroke="' + border + '" stroke-width="1"/>' +
      '<text x="' + (padL-8) + '" y="' + (y+4) + '" text-anchor="end" font-size="11" fill="' + faint + '">' + (+v.toFixed(1)) + '</text>';
  }
  // X 时间标签
  timeLabels.forEach(function(t, i){
    g.innerHTML += '<text x="' + X(i) + '" y="' + (padT + plotH + 20) + '" text-anchor="middle" font-size="11.5" fill="' + muted + '">' + esc(t) + '</text>';
  });
  if (CHART.xLabel) g.innerHTML += '<text x="' + (padL + plotW/2) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11" fill="' + faint + '">' + esc(CHART.xLabel) + '</text>';
  svg.appendChild(g);

  // 图例
  var legend = document.getElementById("legend");
  series.forEach(function(s, i){
    var color = pick(s.color, S[i % S.length]);
    var el = document.createElement("span"); el.className = "lg";
    el.innerHTML = '<span class="sw" style="background:' + color + '"></span>' + esc(s.name);
    legend.appendChild(el);
  });

  // 系列线/点
  series.forEach(function(s, i){
    var color = pick(s.color, S[i % S.length]);
    var pts = s.points || [];
    if (pts.length === 0) return;
    var node = document.createElementNS(NS, "g");
    if (!singleMode && pts.length > 1){
      var d = pts.map(function(p, j){ return (j === 0 ? "M" : "L") + X(j) + " " + Y(p.v); }).join(" ");
      node.innerHTML += '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>';
    }
    pts.forEach(function(p, j){
      var cx = X(j), cy = Y(p.v);
      node.innerHTML +=
        '<circle cx="' + cx + '" cy="' + cy + '" r="5.5" fill="#fff" stroke="' + color + '" stroke-width="2.6"/>' +
        '<text x="' + cx + '" y="' + (cy-11) + '" text-anchor="middle" font-size="12" font-weight="700" fill="' + color + '">' + esc(p.v) + esc(CHART.unit||"") + '</text>';
      var pt = { name:s.name, t:p.t, v:p.v };
      var circ = document.createElementNS(NS, "circle");
      circ.setAttribute("cx", cx); circ.setAttribute("cy", cy); circ.setAttribute("r", 12); circ.setAttribute("fill", "transparent"); circ.style.cursor = "pointer";
      circ.addEventListener("mouseenter", function(){ showTip(pt); });
      circ.addEventListener("mousemove", moveTip);
      circ.addEventListener("mouseleave", hideTip);
      node.appendChild(circ);
    });
    svg.appendChild(node);
  });

  document.getElementById("stage").appendChild(svg);

  function showTip(p){
    var t = document.getElementById("tip");
    t.innerHTML = '<div class="tt">' + esc(p.name) + '</div>' +
      (p.t ? '<div>' + esc(p.t) + '</div>' : "") +
      '<div style="color:' + viz("--viz-info", "#7da6ff") + ';font-weight:600">' + esc(p.v) + esc(CHART.unit||"") + '</div>';
    t.classList.add("on");
  }
  function moveTip(evt){
    var t = document.getElementById("tip"), r = t.getBoundingClientRect();
    var x = evt.clientX + 14, y = evt.clientY - 10;
    if (x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - 14;
    t.style.left = x + "px"; t.style.top = y + "px";
  }
  function hideTip(){ document.getElementById("tip").classList.remove("on"); }
})();
</script>
