<!-- HTML fragment（Tool Smith 可视化交付格式）：仅内容 + <style> + <script>，无文档级包裹标签 -->
<!-- 设计语言：lieflat-charts L11 Trend Lineage 语法延伸（violet 紫罗兰预设）
     圆点=事件节点（实心=披露/更新，空心=里程碑锚点），圆点大小=证据成熟度（phase）
     圆点直接坐基线上（点轴一体，关联清晰），数值纵排多行在圆点上方（离开轴线），基线下为日期
     标签/数值/日期均支持多行（value 支持 \n 手动分行 + 自动折行），固定槽位顶部对齐
     端部锚定（首节点左对齐、末节点右对齐）防溢出 -->
<style>
/* ===== 颜色全部引用宿主注入 --viz-*（fallback = lieflat violet 预设） ===== */
:root{
  --brand-bg:#F7F2EB; --brand-surface:#F7F2EB; --brand-text:#2B1450;
  --brand-muted:rgba(43,20,80,.60); --brand-faint:rgba(43,20,80,.32); --brand-border:rgba(43,20,80,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--viz-background,var(--brand-bg))}
body{font-family:var(--font-sans,"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif);color:var(--viz-text,var(--brand-text));-webkit-font-smoothing:antialiased;padding:24px 20px}
.chart{background:var(--viz-surface,var(--viz-background,var(--brand-surface)));border-radius:24px;padding:26px 28px 18px;max-width:920px;margin:0 auto}
.badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.1em;padding:3px 11px;border-radius:99px;margin-bottom:14px;border:1px dashed var(--viz-text-muted,var(--brand-faint));color:var(--viz-text-muted,var(--brand-muted))}
h1{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.sub{font-size:12px;color:var(--viz-text-muted,var(--brand-muted));margin-top:5px;line-height:1.65}
.stage{position:relative;width:100%;margin:14px 0 2px}
.stage svg{display:block;width:100%;height:auto}
svg text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:7px 16px;margin:4px 0 2px;font-size:11.5px;color:var(--viz-text-muted,var(--brand-muted))}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px;border-radius:50%;flex:none;box-sizing:border-box}
.legend .hint{color:var(--viz-text-muted,var(--brand-faint));font-size:10.5px;margin-left:4px}
.src{margin-top:14px;padding-top:11px;border-top:1px dashed var(--viz-text-muted,var(--brand-faint));font-size:9.5px;letter-spacing:.08em;font-weight:500;color:var(--viz-text-muted,var(--brand-faint));display:flex;flex-wrap:wrap;gap:3px 14px;line-height:1.65}
.src b{font-weight:600;color:var(--viz-text-muted,var(--brand-muted))}
.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1.3) both}
@keyframes pop{from{transform:scale(0)}to{transform:none}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.4,0,.2,1) both}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.fade,.pop{animation:none}.draw{animation:none;stroke-dasharray:none;stroke-dashoffset:0}}
.tip{position:fixed;pointer-events:none;background:#2B1450;color:#F7F2EB;font-size:12px;padding:10px 13px;border-radius:12px;max-width:320px;line-height:1.55;opacity:0;transition:opacity .12s;z-index:99;box-shadow:0 10px 26px -10px rgba(43,20,80,.5)}
@supports (color: color-mix(in srgb, red, transparent)){
  .tip{background:color-mix(in srgb, var(--viz-text,var(--brand-text)) 94%, transparent)}
}
.tip.on{opacity:1}
.tip .tt{font-weight:700;margin-bottom:2px;color:#C6B3EE}
</style>

<div class="chart">
  <span class="badge" id="badge">EVIDENCE TIMELINE</span>
  <h1 id="title">证据链时间轴</h1>
  <div class="sub" id="subtitle"></div>
  <div class="stage" id="stage"></div>
  <div class="legend" id="legend"></div>
  <div class="src">
    <span id="note"></span>
    <span id="source"></span>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
/* ===================== 数据区（Agent 填写；仅来自临床证据原文） =====================
   events[]：一条 = 一个证据状态（同状态多篇披露合并为一节点，note 并列 {{ref_n}}）；
   按来源支持的 数据截止→随访→分析里程碑→披露日期 排布，模板按数组顺序从左到右，
   不自行推断阶段/形式（数组顺序即时间顺序，模板不重排）。date 缺失时写“时间未明”，不得猜测日期。
   kind   ：图例键，见下方 legend；未命中图例时取主色 DATA。
   phase  ：证据链成熟度（0=里程碑/无，1..n 依次递增表示证据逐步成熟）→ 圆点越大越成熟；缺省 0。
   value  ：该状态关键数值，支持 "行1\n行2" 多行（每行再自动折行，每节点最多 3 行）；可空。
   note   ：悬停提示的补充说明 + {{ref_n}}。
   视觉：实心圆=披露/更新（有数值），空心圆=里程碑（无数值，仅时间锚点）；
   圆点直接坐基线上（点轴一体），数值纵排多行在圆点上方（离开轴线），基线下为日期；
   颜色一律走 violet 单色系，不混入第二套色系。
   颜色：legend 的 color 填 Tool Smith 语义 token 名（如 "--viz-series-1"）或 hex。
*/
const CHART = {
  title: "TRAIN-2（NCT01996267）证据链时间轴",
  subtitle: "同一试验证据披露与结果演进 · 节点=合并后的证据状态（5 篇披露 → 3 个证据状态 + 1 个里程碑）",
  note: "同一试验证据状态 ≥2 个时生成此图；证据边界：仅 source_full_text",
  source: "数据来源：TRAIN-2（BOOG 2012-03）公开披露材料（source_full_text 提取）",
  legend: [
    { key:"milestone",  label:"研究里程碑", color:"#C6B3EE" },
    { key:"disclosure", label:"证据披露",   color:"#55339A" },
    { key:"update",     label:"数据更新",   color:"#8A63D2" }
  ],
  events: [
    { date:"2013-12 · 入组启动", label:"研究启动（里程碑）", kind:"milestone", phase:0, value:"", note:"2013-12-09 起入组、2016-01-14 完成；438 例 1:1 随机、荷兰 37 家中心{{ref_3}}" },
    { date:"2016-08 · 披露", label:"早期毒性分析", kind:"disclosure", phase:1, value:"FN 9% vs 0%\nG3-4 中性粒 53% vs 51%", note:"110 例早期子集：G3-4 中性粒细胞减少 53% vs 51%、无症状 LVEF 下降 G2 24% vs 11%、G3-4 腹泻 5% vs 18%{{ref_5}}" },
    { date:"2017-03/2018-12 · 中位随访 19 个月", label:"pCR 主要分析 · 摘要/主刊", kind:"disclosure", phase:2, value:"pCR 67% vs 68%\n摘要 p=0.75 · 主刊 0.95", note:"418 例可评估（蒽环 212 vs 非蒽环 206）；摘要 p=0.75、主刊 p=0.95，数值一致、统计量有出入{{ref_1}}{{ref_3}}" },
    { date:"2020-05/2021-05 · 中位随访 48.8 个月", label:"3 年 EFS/OS 随访 · 摘要/主刊", kind:"update", phase:3, value:"EFS HR 0.90\n95% CI 0.50–1.63", note:"3 年 EFS 92.7% vs 93.6%、OS 97.7% vs 98.2%（95% CI 0.50-1.63）；蒽环组 2 例急性白血病；LVEF 下降蒽环组更多{{ref_2}}{{ref_4}}" }
  ],
  chain: { show:true, label:"证据链成熟度" }
};

/* ===================== 渲染区（模板逻辑，勿改） ===================== */
(function(){
  var ev = CHART.events || [], n = ev.length;
  var W = 920, H = 272;
  var padL = 44, padR = 44;
  var baseY = 200;   // 时间轴基线
  var dotY = baseY;   // 圆点直接坐基线上（点轴一体，关联清晰）
  var plotW = W - padL - padR;
  function x(i){ return padL + plotW * (n === 1 ? 0.5 : i / (n - 1)); }
  function esc(s){ return String(s == null ? "" : s).replace(/[<>&]/g, function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]; }); }
  // 读取宿主注入的 --viz-* token；未注入时返回 violet fallback
  function viz(name, fb){ var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fb; }
  // 颜色：支持 token 名（"--viz-xxx"）或 hex
  function pick(c, fb){ return (c && c.indexOf("--viz") === 0) ? viz(c, fb) : (c || fb); }
  function kindColor(kind){
    if (CHART.legend){ var m = CHART.legend.find(function(l){ return l.key === kind; }); if (m && m.color) return pick(m.color, viz("--viz-series-1", "#55339A")); }
    return viz("--viz-series-1", "#55339A");
  }
  // 圆点半径 = 证据成熟度（phase 递增 → 更大，上限 4 档）
  function rad(e){ var p = (e.phase == null ? 0 : e.phase); return 6.5 + Math.min(Math.max(p, 0), 4) * 1.6; }
  // 折行：按近似字符宽切行（中文近似等宽），cap 为最大行数
  function wrap(s, per, cap){ s = String(s == null ? "" : s); if (s.length <= per) return [s]; var a = [], i = 0; while (i < s.length){ a.push(s.slice(i, i + per)); i += per; if (a.length >= (cap || 3)) break; } return a; }
  // 数值多行：先按 \n 手动分行，每段再自动折行，总数上限 3 行
  function wrapValue(s, per){
    s = String(s == null ? "" : s); if (!s) return [];
    var out = [], segs = s.split("\n"), i, seg;
    for (i = 0; i < segs.length; i++){ seg = segs[i]; if (!seg) continue; out = out.concat(wrap(seg, per, 3)); if (out.length >= 3) break; }
    return out.slice(0, 3);
  }
  // 端部锚定：首节点左对齐、末节点右对齐，中间居中 → 防两端溢出
  function anchorFor(i){ return i === 0 ? "start" : (i === n - 1 ? "end" : "middle"); }
  function axFor(i){ return i === 0 ? padL + 2 : (i === n - 1 ? W - padR - 2 : x(i)); }
  var INK = viz("--viz-text","#2B1450");
  var PAPER = viz("--viz-background","#F7F2EB");
  var MUTED = viz("--viz-text-muted","rgba(43,20,80,.60)");
  var GRID = viz("--viz-border","rgba(43,20,80,.16)");
  var spacing = plotW / Math.max(1, n - 1);
  var labelPer = Math.max(6, Math.min(12, Math.round(spacing / 15)));
  var datePer = Math.max(8, Math.min(16, Math.round(spacing / 11)));
  var valuePer = Math.max(6, Math.min(14, Math.round(spacing / 12)));

  document.getElementById("badge").textContent = "EVIDENCE TIMELINE";
  document.getElementById("title").textContent = CHART.title;
  document.getElementById("subtitle").textContent = CHART.subtitle || "";
  document.getElementById("note").innerHTML = CHART.note ? "<b>说明：</b>" + esc(CHART.note) : "";
  document.getElementById("source").textContent = CHART.source || "";

  // 图例：里程碑 = 空心圆，披露/更新 = 实心圆
  var legend = document.getElementById("legend");
  (CHART.legend || []).forEach(function(l){
    var el = document.createElement("span"); el.className = "lg";
    var c = pick(l.color, "#55339A");
    el.innerHTML = (l.key === "milestone")
      ? '<span class="dot" style="background:' + PAPER + ';border:1.6px solid ' + c + '"></span>' + esc(l.label)
      : '<span class="dot" style="background:' + c + '"></span>' + esc(l.label);
    legend.appendChild(el);
  });
  if (CHART.chain && CHART.chain.show && CHART.chain.label){
    var hint = document.createElement("span"); hint.className = "hint";
    hint.textContent = "· 圆点越大 = 证据越成熟";
    legend.appendChild(hint);
  }

  var NS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("role", "img");

  // 时间轴基线（发丝，draw 动画从左到右展开）
  var g = document.createElementNS(NS, "g");
  g.innerHTML = '<line x1="' + padL + '" y1="' + baseY + '" x2="' + (W - padR) + '" y2="' + baseY + '" stroke="' + GRID + '" stroke-width="1.4" class="draw" style="animation-delay:.1s"/>' +
    '<circle cx="' + padL + '" cy="' + baseY + '" r="2.6" fill="' + GRID + '" class="fade"/>' +
    '<circle cx="' + (W - padR) + '" cy="' + baseY + '" r="2.6" fill="' + GRID + '" class="fade"/>';
  svg.appendChild(g);

  // 事件节点：标签（顶部对齐）→ 数值（圆点上方，多行，顶部对齐）→ 圆点（坐基线）→ 日期（基线下）
  var LBL_TOP = 52, LBL_LH = 15;  // 标签区首行 y（固定槽，顶部对齐）
  var VAL_TOP = 96, VAL_LH = 16;  // 数值区首行 y（固定槽，圆点上方，顶部对齐）
  var DATE_TOP = 222, DATE_LH = 14; // 日期区首行 y（固定槽，基线下）
  ev.forEach(function(e, i){
    var cx = x(i), r = rad(e), color = kindColor(e.kind);
    var hollow = (e.kind === "milestone");
    var anchor = anchorFor(i), ax = axFor(i);
    var lbl = wrap(e.label, labelPer, 2);   // 标签 ≤2 行
    var vals = wrapValue(e.value, valuePer); // 数值 ≤3 行
    var dts = wrap(e.date, datePer, 2);     // 日期 ≤2 行
    // 三块均为固定槽位顶部对齐：标签 LBL_TOP 起、数值 VAL_TOP 起、日期 DATE_TOP 起
    var lspans = "", vspans = "", dspans = "", li, vi, di;
    for (li = 0; li < lbl.length; li++){
      lspans += '<tspan x="' + ax + '" y="' + (LBL_TOP + li * LBL_LH) + '">' + esc(lbl[li]) + '</tspan>';
    }
    for (vi = 0; vi < vals.length; vi++){
      vspans += '<tspan x="' + ax + '" y="' + (VAL_TOP + vi * VAL_LH) + '">' + esc(vals[vi]) + '</tspan>';
    }
    for (di = 0; di < dts.length; di++){
      dspans += '<tspan x="' + ax + '" y="' + (DATE_TOP + di * DATE_LH) + '">' + esc(dts[di]) + '</tspan>';
    }
    var node = document.createElementNS(NS, "g");
    node.style.cursor = "pointer";
    node.innerHTML =
      // 标签（顶部对齐，纸色光晕，fade）
      '<text x="' + ax + '" y="' + LBL_TOP + '" text-anchor="' + anchor + '" font-size="12" font-weight="600" fill="' + INK + '" paint-order="stroke" stroke="' + PAPER + '" stroke-width="3.5px" class="fade" style="animation-delay:' + (i * 0.09 + 0.1) + 's">' + lspans + '</text>' +
      // 数值（圆点上方纵排，多行，800；离开轴线，顶部对齐）
      (vals.length ? '<text x="' + ax + '" y="' + VAL_TOP + '" text-anchor="' + anchor + '" font-size="12" font-weight="800" fill="' + color + '" paint-order="stroke" stroke="' + PAPER + '" stroke-width="3px" class="fade" style="animation-delay:' + (i * 0.09 + 0.2) + 's">' + vspans + '</text>' : "") +
      // 节点圆点（坐基线上，pop；里程碑空心，披露/更新实心）
      (hollow
        ? '<circle cx="' + cx + '" cy="' + dotY + '" r="' + r + '" fill="' + PAPER + '" stroke="' + color + '" stroke-width="2" class="pop" style="animation-delay:' + (i * 0.09 + 0.1) + 's"/>'
        : '<circle cx="' + cx + '" cy="' + dotY + '" r="' + r + '" fill="' + color + '" class="pop" style="animation-delay:' + (i * 0.09 + 0.1) + 's"/>') +
      // 日期（基线下）
      '<text x="' + ax + '" y="' + (DATE_TOP + (dts.length - 1) * DATE_LH) + '" text-anchor="' + anchor + '" font-size="10.5" font-weight="600" fill="' + MUTED + '" paint-order="stroke" stroke="' + PAPER + '" stroke-width="3px" class="fade" style="animation-delay:' + (i * 0.09 + 0.18) + 's">' + dspans + '</text>';
    node.addEventListener("mouseenter", function(){ showTip(e); });
    node.addEventListener("mousemove", moveTip);
    node.addEventListener("mouseleave", hideTip);
    svg.appendChild(node);
  });

  document.getElementById("stage").appendChild(svg);

  function showTip(e){
    var t = document.getElementById("tip");
    t.innerHTML = '<div class="tt">' + esc(e.label) + '</div>' +
      '<div style="opacity:.85">' + esc(e.date) + '</div>' +
      (e.value ? '<div style="font-weight:800;white-space:pre-line">' + esc(e.value) + '</div>' : "") +
      (e.note ? '<div style="opacity:.85">' + esc(e.note) + '</div>' : "");
    t.classList.add("on");
  }
  function moveTip(evt){
    var t = document.getElementById("tip"), rr = t.getBoundingClientRect();
    var x2 = evt.clientX + 14, y2 = evt.clientY - 10;
    if (x2 + rr.width > window.innerWidth - 8) x2 = evt.clientX - rr.width - 14;
    t.style.left = x2 + "px"; t.style.top = y2 + "px";
  }
  function hideTip(){ document.getElementById("tip").classList.remove("on"); }
})();
</script>
