<!-- HTML fragment（Tool Smith 可视化交付格式）：仅内容 + <style> + <script>，无文档级包裹标签 -->
<!-- 设计语言：lieflat-charts violet 紫罗兰预设 · 单色系多档紫 · 发丝网格 · 数值标签纸色描边光晕 -->
<style>
/* ===== 颜色全部引用宿主注入 --viz-*（fallback = lieflat violet 预设） ===== */
:root{
  --brand-bg:#F7F2EB; --brand-surface:#F7F2EB; --brand-text:#2B1450;
  --brand-muted:rgba(43,20,80,.60); --brand-faint:rgba(43,20,80,.32); --brand-border:rgba(43,20,80,.16);
  --brand-s1:#55339A; --brand-s2:#2B1450; --brand-s3:#8A63D2; --brand-s4:#C6B3EE; --brand-s5:#E4DAF8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--viz-background,var(--brand-bg))}
body{font-family:var(--font-sans,"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif);color:var(--viz-text,var(--brand-text));-webkit-font-smoothing:antialiased;padding:24px 20px}
.chart{background:var(--viz-surface,var(--viz-background,var(--brand-surface)));border-radius:24px;padding:26px 28px 18px;max-width:920px;margin:0 auto}
.badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.1em;padding:3px 11px;border-radius:99px;margin-bottom:14px;border:1px dashed var(--viz-text-muted,var(--brand-faint));color:var(--viz-text-muted,var(--brand-muted))}
h1{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.sub{font-size:12px;color:var(--viz-text-muted,var(--brand-muted));margin-top:5px;line-height:1.65}
.stage{position:relative;width:100%;margin:14px 0 2px}
.stage svg{display:block;width:100%;height:auto}
svg text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:7px 16px;margin:4px 0 2px;font-size:11.5px;color:var(--viz-text-muted,var(--brand-muted))}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:20px;height:3px;border-radius:2px;flex:none;margin-top:1px}
.src{margin-top:14px;padding-top:11px;border-top:1px dashed var(--viz-text-muted,var(--brand-faint));font-size:9.5px;letter-spacing:.08em;font-weight:500;color:var(--viz-text-muted,var(--brand-faint));display:flex;flex-wrap:wrap;gap:3px 14px;line-height:1.65}
.src b{font-weight:600;color:var(--viz-text-muted,var(--brand-muted))}
.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) both}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.draw{animation:none;stroke-dasharray:none;stroke-dashoffset:0}}
.tip{position:fixed;pointer-events:none;background:#2B1450;color:#F7F2EB;font-size:12px;padding:10px 13px;border-radius:12px;max-width:320px;line-height:1.55;opacity:0;transition:opacity .12s;z-index:99;box-shadow:0 10px 26px -10px rgba(43,20,80,.5)}
@supports (color: color-mix(in srgb, red, transparent)){
  .tip{background:color-mix(in srgb, var(--viz-text,var(--brand-text)) 94%, transparent)}
}
.tip.on{opacity:1}
.tip .tt{font-weight:700;margin-bottom:2px;color:#C6B3EE}
</style>

<div class="chart">
  <span class="badge" id="badge">TREND LINE · VIOLET</span>
  <h1 id="title">终点趋势 · 折线图</h1>
  <div class="sub" id="subtitle"></div>
  <div class="stage" id="stage"></div>
  <div class="legend" id="legend"></div>
  <div class="src">
    <span id="note"></span>
    <span id="source"></span>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
/* ===================== 数据区（Agent 填写；仅来自临床证据原文） =====================
   适用：混合/不同试验、终点有时间维度（如体重较基线变化、PFS/OS 等按时间点取值）。
   series[]：
     name   系列名（试验+治疗组）；color 系列色（缺省自动取紫系 SER 档位，也可填
             token 名如 "--viz-series-1" 或 hex）；
     points 时间点数组 [{t:时间标签, v:数值}]。若全部系列都只有 1 个点，
     自动进入「单点模式」：只画点 + 数值标签，不强行连线。
   unit：数值单位；xLabel：时间轴标题（可空）。
   排序：折线按时间顺序（points 数组顺序即时间顺序，模板不重排）；柱状图才按数值降序。
   色彩逻辑：violet 单色系多档紫（SER），不混入第二套色系；线宽 ×1.8 保持彩色可读。
*/
const CHART = {
  title: "体重较基线的变化",
  subtitle: "时间维主要终点 · 不同治疗组随时间的趋势",
  unit: "kg",
  xLabel: "治疗周数",
  note: "折线仅连接已披露的时间点，不作外推；单点终点以点展示",
  source: "数据来源：各研究公开披露材料（source_full_text 提取）",
  series: [
    { name:"试验A · 研究组", points:[ {t:"W4",v:-1.2}, {t:"W12",v:-2.8}, {t:"W24",v:-3.1} ] },
    { name:"试验A · 对照组", points:[ {t:"W4",v:-0.4}, {t:"W12",v:-0.9}, {t:"W24",v:-1.2} ] }
  ]
};

/* ===================== 渲染区（模板逻辑，勿改） ===================== */
(function(){
  // 读取宿主注入的 --viz-* token（未注入时用 violet fallback）
  function viz(name, fb){ var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fb; }
  // 颜色：支持 token 名（"--viz-xxx"）或 hex
  function pick(c, fb){ return (c && c.indexOf("--viz") === 0) ? viz(c, fb) : (c || fb); }
  // 系列紫系色：单色系多档紫（明度区分治疗组，最重要最深的放前面）
  var SER = [viz("--viz-series-1","#2B1450"), viz("--viz-series-2","#55339A"), viz("--viz-series-3","#8A63D2"), viz("--viz-series-4","#C6B3EE"), viz("--viz-series-5","#E4DAF8")];
  var INK = viz("--viz-text","#2B1450");
  var PAPER = viz("--viz-background","#F7F2EB");
  var FAINT = viz("--viz-text-muted","rgba(43,20,80,.32)");
  var MUTED = viz("--viz-text-muted","rgba(43,20,80,.60)");
  var GRID = viz("--viz-border","rgba(43,20,80,.16)");

  var series = CHART.series || [], nS = series.length;
  var allPts = []; series.forEach(function(s){ allPts = allPts.concat(s.points || []); });
  var singleMode = allPts.length > 0 && series.every(function(s){ return (s.points||[]).length === 1; });

  var W = 900, H = 372, padL = 62, padR = 44, padT = 40, padB = 54;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  var timeLabels = (series[0] && series[0].points ? series[0].points : []).map(function(p){ return p.t; });
  var m = timeLabels.length;
  var allV = allPts.map(function(p){ return p.v; });
  var minV = Math.min.apply(null, allV), maxV = Math.max.apply(null, allV);
  var span = (maxV - minV) || 1; minV -= span * 0.22; maxV += span * 0.22;
  function X(i){ return m === 1 ? padL + plotW/2 : padL + plotW * i / (m - 1); }
  function Y(v){ return padT + plotH * (maxV - v) / (maxV - minV); }
  function esc(s){ return String(s == null ? "" : s).replace(/[<>&]/g, function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]; }); }

  document.getElementById("badge").textContent = "TREND LINE · " + (CHART.unit||"").toUpperCase() + " · " + (singleMode ? "SINGLE-POINT" : "TIMED");
  document.getElementById("title").textContent = CHART.title;
  document.getElementById("subtitle").textContent = (CHART.subtitle||"") + (singleMode ? " · 单点模式" : "");
  document.getElementById("note").innerHTML = CHART.note ? "<b>说明：</b>" + esc(CHART.note) : "";
  document.getElementById("source").textContent = CHART.source || "";

  var NS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("role", "img");

  // 网格 + Y 刻度（发丝 GRID）
  var g = document.createElementNS(NS, "g");
  for (var k = 0; k <= 4; k++){
    var v = minV + (maxV - minV) * k / 4, y = Y(v);
    g.innerHTML += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W-padR) + '" y2="' + y + '" stroke="' + GRID + '" stroke-width=".8"/>' +
      '<text x="' + (padL-9) + '" y="' + (y+4) + '" text-anchor="end" font-size="10.5" fill="' + FAINT + '" font-weight="600">' + (+v.toFixed(1)) + '</text>';
  }
  // X 时间标签
  timeLabels.forEach(function(t, i){
    g.innerHTML += '<text x="' + X(i) + '" y="' + (padT + plotH + 22) + '" text-anchor="middle" font-size="11.5" fill="' + MUTED + '" font-weight="600" class="fade" style="animation-delay:' + (i*0.05) + 's">' + esc(t) + '</text>';
  });
  if (CHART.xLabel) g.innerHTML += '<text x="' + (padL + plotW/2) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="10" fill="' + FAINT + '" font-weight="600" letter-spacing=".06em">' + esc(CHART.xLabel) + '</text>';
  svg.appendChild(g);

  // 图例（紫系档位 swatch）
  var legend = document.getElementById("legend");
  series.forEach(function(s, i){
    var color = pick(s.color, SER[i % SER.length]);
    var el = document.createElement("span"); el.className = "lg";
    el.innerHTML = '<span class="sw" style="background:' + color + '"></span>' + esc(s.name);
    legend.appendChild(el);
  });

  // 系列线/点
  series.forEach(function(s, i){
    var color = pick(s.color, SER[i % SER.length]);
    var pts = s.points || [];
    if (pts.length === 0) return;
    var node = document.createElementNS(NS, "g");
    if (!singleMode && pts.length > 1){
      var d = pts.map(function(p, j){ return (j === 0 ? "M" : "L") + X(j) + " " + Y(p.v); }).join(" ");
      node.innerHTML += '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity=".92" class="draw" style="animation-delay:' + (i*0.12) + 's"/>';
    }
    pts.forEach(function(p, j){
      var cx = X(j), cy = Y(p.v);
      node.innerHTML +=
        '<circle cx="' + cx + '" cy="' + cy + '" r="4.6" fill="' + color + '" stroke="' + PAPER + '" stroke-width="2" class="fade" style="animation-delay:' + (i*0.12 + j*0.05 + 0.15) + 's"/>' +
        '<text x="' + cx + '" y="' + (cy-12) + '" text-anchor="middle" font-size="12" font-weight="800" fill="' + INK + '" class="fade" style="animation-delay:' + (i*0.12 + j*0.05 + 0.2) + 's;' + 'paint-order:stroke;stroke:' + PAPER + ';stroke-width:4px">' + esc(p.v) + esc(CHART.unit||"") + '</text>';
      var pt = { name:s.name, t:p.t, v:p.v };
      var circ = document.createElementNS(NS, "circle");
      circ.setAttribute("cx", cx); circ.setAttribute("cy", cy); circ.setAttribute("r", 12); circ.setAttribute("fill", "transparent"); circ.style.cursor = "pointer";
      circ.addEventListener("mouseenter", function(){ showTip(pt); });
      circ.addEventListener("mousemove", moveTip);
      circ.addEventListener("mouseleave", hideTip);
      node.appendChild(circ);
    });
    svg.appendChild(node);
  });

  document.getElementById("stage").appendChild(svg);

  function showTip(p){
    var t = document.getElementById("tip");
    t.innerHTML = '<div class="tt">' + esc(p.name) + '</div>' +
      (p.t ? '<div style="opacity:.85">' + esc(p.t) + '</div>' : "") +
      '<div style="font-weight:800">' + esc(p.v) + esc(CHART.unit||"") + '</div>';
    t.classList.add("on");
  }
  function moveTip(evt){
    var t = document.getElementById("tip"), r = t.getBoundingClientRect();
    var x = evt.clientX + 14, y = evt.clientY - 10;
    if (x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - 14;
    t.style.left = x + "px"; t.style.top = y + "px";
  }
  function hideTip(){ document.getElementById("tip").classList.remove("on"); }
})();
</script>
