<!-- HTML fragment（Tool Smith 可视化交付格式）：仅内容 + <style> + <script>，无文档级包裹标签 -->
<style>
/* ===== Tool Smith 品牌 token（主色一律 var(--viz-*)；品牌 hex 仅作 fallback） ===== */
:root{
  --brand-bg:#f4f5f7; --brand-surface:#ffffff; --brand-text:#020A1A;
  --brand-muted:#4e5969; --brand-faint:#8993a4; --brand-border:#DADEE6;
  --brand-s1:#3d7eff; --brand-s2:#7c3aed; --brand-s3:#0ea5e9; --brand-s4:#14b8a6; --brand-s5:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--viz-background,var(--brand-bg))}
body{font-family:var(--font-sans,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif);color:var(--viz-text,var(--brand-text));-webkit-font-smoothing:antialiased;padding:18px}
.chart{background:var(--viz-surface,var(--brand-surface));border:1px solid var(--viz-border,var(--brand-border));border-radius:var(--border-radius-xl,18px);box-shadow:0 1px 2px rgba(2,10,26,.06),0 16px 40px -20px rgba(2,10,26,.18);padding:22px 26px 16px;max-width:940px;margin:0 auto}
.header{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.accent{flex:none;width:5px;height:36px;border-radius:4px;background:linear-gradient(135deg,var(--viz-series-1,var(--brand-s1)),var(--viz-series-3,var(--brand-s3)));margin-top:2px}
h1{font-size:18px;font-weight:700;letter-spacing:.2px;line-height:1.4}
.sub{font-size:12.5px;color:var(--viz-text-muted,var(--brand-muted));margin-top:3px}
.stage{position:relative;width:100%;margin:8px 0 2px}
.stage svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:6px 0 4px;font-size:12px;color:var(--viz-text-muted,var(--brand-muted))}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
footer{margin-top:4px;padding-top:9px;border-top:1px dashed var(--viz-border,var(--brand-border));font-size:11.5px;color:var(--viz-text-muted,var(--brand-faint));display:flex;flex-wrap:wrap;gap:3px 16px;line-height:1.5}
footer b{color:var(--viz-text-muted,var(--brand-muted));font-weight:600}
.tip{position:fixed;pointer-events:none;background:rgba(2,10,26,.94);color:var(--viz-background,#f4f5f7);font-size:12px;padding:9px 12px;border-radius:10px;max-width:280px;line-height:1.55;opacity:0;transition:opacity .12s;z-index:99;box-shadow:0 10px 26px -10px rgba(2,10,26,.45)}
@supports (color: color-mix(in srgb, red, transparent)){
  .tip{background:color-mix(in srgb, var(--viz-text,var(--brand-text)) 94%, transparent)}
}
.tip.on{opacity:1}
.tip .tt{font-weight:700;margin-bottom:2px;color:var(--viz-info,#7da6ff)}
</style>

<div class="chart">
  <div class="header">
    <span class="accent"></span>
    <div>
      <h1 id="title">证据链时间轴</h1>
      <div class="sub" id="subtitle"></div>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="legend" id="legend"></div>
  <footer>
    <span id="note"></span>
    <span id="source"></span>
  </footer>
</div>
<div class="tip" id="tip"></div>

<script>
/* ===================== 数据区（Agent 填写；仅来自临床证据原文） =====================
   events[]：一条 = 一个证据状态（同状态多篇披露合并为一节点，note 并列 {{ref_n}}）；
   按来源支持的 数据截止→随访→分析里程碑→披露日期 排布，模板按数组顺序从左到右，
   不自行推断阶段/形式。date 缺失时写“时间未明”，不得猜测日期。
   kind   ：图例键，见下方 legend；未命中图例时取主色。
   phase  ：证据链成熟度（0=里程碑/无，1..n 依次递增表示证据逐步成熟）；缺省不参与链带。
   value  ：该状态关键数值（可空）；note：悬停提示的补充说明 + {{ref_n}}。
   颜色：legend 的 color 填 Tool Smith 语义 token 名（如 "--viz-series-1"）或 hex；
   主色一律走 --viz-*（宿主注入），未注入时用品牌 fallback。
*/
const CHART = {
  title: "HARMONi-6 研究证据链时间轴",
  subtitle: "同试验证据披露与结果演进 · 时间线仅按证据披露顺序排列",
  note: "同一试验证据状态 ≥2 个时生成此图；证据边界：仅 source_full_text",
  source: "数据来源：HARMONi-6 研究公开披露材料（source_full_text 提取）",
  legend: [
    { key:"milestone",  label:"研究里程碑", color:"--viz-text-muted" },
    { key:"disclosure", label:"证据披露",   color:"--viz-series-1" },
    { key:"update",     label:"数据更新",   color:"--viz-series-2" }
  ],
  events: [
    { date:"2022-05", label:"研究启动",  kind:"milestone",  phase:0, value:"",            note:"HARMONi-6 研究启动（背景）" },
    { date:"2023-06", label:"ESMO 摘要", kind:"disclosure", phase:1, value:"ORR 54.7%",   note:"首次披露初步疗效数据" },
    { date:"2023-10", label:"数据更新",  kind:"update",     phase:2, value:"ORR 63.5%",   note:"更新后应答率提升" },
    { date:"2024-05", label:"顶刊发表",  kind:"disclosure", phase:3, value:"PFS 9.6 月",  note:"同行评审全文发表，证据成熟" }
  ],
  chain: { show:true, label:"证据链成熟度" }
};

/* ===================== 渲染区（模板逻辑，勿改） ===================== */
(function(){
  var ev = CHART.events || [], n = ev.length;
  var W = 900, H = 292, padL = 46, padR = 46, padT = 72, padB = 72;
  var plotW = W - padL - padR;
  var baseY = H - padB;
  var bandY = baseY + 36, bandH = 14;
  function x(i){ return padL + plotW * (n === 1 ? 0.5 : i / (n - 1)); }
  function esc(s){ return String(s == null ? "" : s).replace(/[<>&]/g, function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]; }); }
  // 读取宿主注入的 --viz-* token；未注入时返回品牌 fallback
  function viz(name, fb){ var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fb; }
  // 颜色：支持 token 名（"--viz-xxx"）或 hex；未命中用 series-1
  function pick(c, fb){ return (c && c.indexOf("--viz") === 0) ? viz(c, fb) : (c || fb); }
  function kindColor(kind){
    if (CHART.legend){ var m = CHART.legend.find(function(l){ return l.key === kind; }); if (m && m.color) return pick(m.color, viz("--viz-series-1", "#3d7eff")); }
    return viz("--viz-series-1", "#3d7eff");
  }
  function chainLabel(){ return (CHART.chain && CHART.chain.label) || "证据链成熟度"; }

  document.getElementById("title").textContent = CHART.title;
  document.getElementById("subtitle").textContent = CHART.subtitle || "";
  document.getElementById("note").innerHTML = CHART.note ? "<b>说明：</b>" + esc(CHART.note) : "";
  document.getElementById("source").textContent = CHART.source || "";

  var legend = document.getElementById("legend");
  (CHART.legend || []).forEach(function(l){
    var el = document.createElement("span"); el.className = "lg";
    el.innerHTML = '<span class="dot" style="background:' + pick(l.color, "#3d7eff") + '"></span>' + esc(l.label);
    legend.appendChild(el);
  });

  var NS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("role", "img");

  // 渐变定义（先挂载；颜色用运行时解析的 token）
  var gf = document.createElementNS(NS, "linearGradient"); gf.id = "gradFlag"; gf.setAttribute("x1","0"); gf.setAttribute("y1","0"); gf.setAttribute("x2","0"); gf.setAttribute("y2","1");
  gf.innerHTML = '<stop offset="0" stop-color="' + viz("--viz-series-1", "#3d7eff") + '"/><stop offset="1" stop-color="' + viz("--viz-series-2", "#7c3aed") + '"/>'; svg.appendChild(gf);
  var gc = document.createElementNS(NS, "linearGradient"); gc.id = "gradChain"; gc.setAttribute("x1","0"); gc.setAttribute("y1","0"); gc.setAttribute("x2","1"); gc.setAttribute("y2","0");
  gc.innerHTML = '<stop offset="0" stop-color="' + viz("--viz-series-1", "#3d7eff") + '"/><stop offset=".55" stop-color="' + viz("--viz-series-2", "#7c3aed") + '"/><stop offset="1" stop-color="' + viz("--viz-series-3", "#0ea5e9") + '"/>'; svg.appendChild(gc);

  // 时间轴基线
  var base = viz("--viz-border", "#DADEE6");
  var g = document.createElementNS(NS, "g");
  g.innerHTML = '<line x1="' + padL + '" y1="' + baseY + '" x2="' + (W-padR) + '" y2="' + baseY + '" stroke="' + base + '" stroke-width="1.6"/>' +
    '<circle cx="' + padL + '" cy="' + baseY + '" r="3.5" fill="' + base + '"/><circle cx="' + (W-padR) + '" cy="' + baseY + '" r="3.5" fill="' + base + '"/>';
  svg.appendChild(g);

  var ink = viz("--viz-text", "#020A1A");
  var muted = viz("--viz-text-muted", "#4e5969");

  // 事件旗帜 + 标签 + 数值 + 日期
  ev.forEach(function(e, i){
    var cx = x(i), color = kindColor(e.kind);
    var node = document.createElementNS(NS, "g");
    node.style.cursor = "pointer";
    node.innerHTML =
      // 旗标
      '<rect x="' + (cx-10) + '" y="' + (padT+6) + '" width="20" height="30" rx="5" fill="url(#gradFlag)" opacity=".95"/>' +
      '<rect x="' + (cx-10) + '" y="' + (padT+6) + '" width="20" height="7" rx="3.5" fill="#fff" opacity=".35"/>' +
      '<path d="M' + cx + ' ' + (padT+36) + ' L' + (cx-7) + ' ' + baseY + ' L' + (cx+7) + ' ' + baseY + ' Z" fill="' + color + '" opacity=".92"/>' +
      '<line x1="' + cx + '" y1="' + (padT+36) + '" x2="' + cx + '" y2="' + baseY + '" stroke="' + color + '" stroke-width="1.1" opacity=".3"/>' +
      // 标签（旗帜上方）
      '<text x="' + cx + '" y="' + (padT-5) + '" text-anchor="middle" font-size="13" font-weight="600" fill="' + ink + '">' + esc(e.label) + '</text>' +
      // 数值（旗帜下方，有则显示）
      (e.value ? '<text x="' + cx + '" y="' + (padT+58) + '" text-anchor="middle" font-size="12.5" font-weight="700" fill="' + color + '">' + esc(e.value) + '</text>' : "") +
      // 日期（轴下方）
      '<text x="' + cx + '" y="' + (baseY+20) + '" text-anchor="middle" font-size="11.5" fill="' + muted + '">' + esc(e.date) + '</text>';
    node.addEventListener("mouseenter", function(){ showTip(e); });
    node.addEventListener("mousemove", moveTip);
    node.addEventListener("mouseleave", hideTip);
    svg.appendChild(node);
  });

  // 证据链成熟度带
  if (CHART.chain && CHART.chain.show){
    var g2 = document.createElementNS(NS, "g");
    g2.innerHTML =
      '<text x="' + padL + '" y="' + (bandY-9) + '" font-size="11.5" font-weight="600" fill="' + muted + '">' + esc(chainLabel()) + '</text>' +
      '<rect x="' + padL + '" y="' + bandY + '" width="' + plotW + '" height="' + bandH + '" rx="' + (bandH/2) + '" fill="url(#gradChain)" opacity=".9"/>';
    ev.forEach(function(e, i){
      if (e.phase == null) return;
      g2.innerHTML += '<circle cx="' + x(i) + '" cy="' + (bandY + bandH/2) + '" r="5" fill="#fff" stroke="' + viz("--viz-series-2", "#7c3aed") + '" stroke-width="2.5"/>';
    });
    svg.appendChild(g2);
  }

  document.getElementById("stage").appendChild(svg);

  function showTip(e){
    var t = document.getElementById("tip");
    t.innerHTML = '<div class="tt">' + esc(e.label) + '</div>' + esc(e.date) +
      (e.value ? '<div style="color:' + viz("--viz-info", "#7da6ff") + ';font-weight:600">' + esc(e.value) + '</div>' : "") +
      (e.note ? '<div>' + esc(e.note) + '</div>' : "");
    t.classList.add("on");
  }
  function moveTip(evt){
    var t = document.getElementById("tip"), r = t.getBoundingClientRect();
    var x = evt.clientX + 14, y = evt.clientY - 10;
    if (x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - 14;
    t.style.left = x + "px"; t.style.top = y + "px";
  }
  function hideTip(){ document.getElementById("tip").classList.remove("on"); }
})();
</script>
